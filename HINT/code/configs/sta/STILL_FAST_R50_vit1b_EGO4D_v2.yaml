NUM_DEVICES: 1
TASK: 'sta' 
SAVE_TOP_K: 10
DATA:
  STILL:
    MIN_SIZE: [640, 672, 704, 736, 768, 800]
    MAX_SIZE: 1333
    FAST_TO_STILL_SIZE_RATIO: 0.32
  FAST:
    NUM_FRAMES: 16
    SAMPLING_RATE: 1
MODEL:
  NAME: StillFast
  NOUN_CLASSES: 105 # 128 105
  VERB_CLASSES: 52 # 81 52
  LOSS:
    WEIGHTS:
      NOUN: 1.0   # 1.0
      VERB: 0.1   # 0.1
      TTC: 0.5    # 0.5
  STILL:
    PRETRAINED: True
    REPLACE_HEAD: True
    BACKBONE:
      NAME: resnet50
      PRETRAINED: True
    BOX:
      POOLER_SAMPLING_RATIO: 0
  FAST:
    BACKBONE:
      NAME: vit-1b
      PRETRAINED: True
  STILLFAST:
    ROI_HEADS:
      VERSION: v2
      V2_OPTIONS:
        FUSION: concat_residual
    FUSION:
      FUSION_BLOCK: convolutional
      CONVOLUTIONAL_FUSION_BLOCK:
        POOLING: mean
        CONV_BLOCK_ARCHITECTURE: simple_convolution
        POST_UP_CONV_BLOCK: True
        POST_SUM_CONV_BLOCK: True
        GATING_BLOCK: 'None'
      POST_PYRAMID_FUSION: False
      PRE_PYRAMID_FUSION: True     
      LATERAL_CONNECTIONS: False
SOLVER:
  BASE_LR: 0.00002
  WEIGHT_DECAY: 0.001 # 0.0001
  MAX_EPOCH: 30
  LR_POLICY: multistep_warmup
  GAMMA: 0.1
  WARMUP_STEPS: 6000 #6000
  MILESTONES: [10, 30]
  PRECISION: 16
EGO4D_STA:
  STILL_FRAMES_PATH: "/data/egodata/object_frames"
  FAST_LMDB_PATH: "/data/egodata/lmdb"
  ANNOTATION_DIR: "/data/egodata/v2/annotations"
  TRAIN_LISTS: [fho_sta_train.json] 
  VAL_LISTS: [fho_sta_val.json]
  TEST_LISTS: [fho_sta_test_unannotated.json]

# EGO4D_STA:
#   STILL_FRAMES_PATH: "/data/egodata/object_frames_v2"
#   FAST_LMDB_PATH: "/data/egodata/lmdb_v1"
#   ANNOTATION_DIR: "/data/egodata/v11/v1/annotations"
#   TRAIN_LISTS: [fho_sta_train.json] 
#   VAL_LISTS: [fho_sta_val.json]
#   TEST_LISTS: [fho_sta_test_unannotated.json]

TRAIN:
  BATCH_SIZE: 2
  DATASET: "EpicKitchens_ShortTermAnticipation" # Ego4dShortTermAnticipationStillVideo   EpicKitchens_ShortTermAnticipation
  AUGMENTATIONS:
    RANDOM_HORIZONTAL_FLIP: True

VAL:
  DATASET: "EpicKitchens_ShortTermAnticipation"
  BATCH_SIZE: 2
  GROUP_BATCH_SAMPLER: True

TEST:
  DATASET: "EpicKitchens_ShortTermAnticipation"
  BATCH_SIZE: 4

DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: False

  
